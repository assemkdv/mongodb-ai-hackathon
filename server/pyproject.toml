[project]
name = "rehearsal-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
